name: Release PR

# develop に push されるたびに develop → main のリリースPRを作成・更新する
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or update release PR
        run: python3 scripts/release_pr.py
        env:
          GH_TOKEN: ${{ github.token }}

[project]
name = "bond-chart-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.1",
    "dash>=4.1.0",
    "gunicorn>=23.0.0",
    "numpy>=2.0.0",
    "plotly>=6.6.0",
    "psycopg2-binary>=2.9.0",
    "pyscipopt>=5.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[tool.ruff.lint.per-file-ignores]
# main.py は env を先に読み込むため load_dotenv() の後に import する
"main.py" = ["E402"]
